<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Quest 4.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080c15;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:680px;margin:auto;padding:14px}
header,.card{background:#111827;border:1px solid #293650;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 30px #0004}
h1{margin:0;font-size:27px}h2{margin-top:0}
.muted{color:#9ba8bf;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.stat{background:#0a101c;border-radius:12px;text-align:center;padding:8px;font-size:11px;color:#9ba8bf}
.stat b{display:block;color:#fff;font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
button{border:0;border-radius:13px;padding:13px;font-weight:800;color:#fff;background:#252e43}
button:active{transform:scale(.98)}
.tab.active,.primary{background:#7058e8}
.answers{display:grid;gap:9px}
.answer{text-align:left;font-size:16px}
.question{text-align:center;font-size:21px;font-weight:800;line-height:1.4;margin:18px 0}
.enemy{text-align:center;font-size:65px}.enemyname{text-align:center;font-size:19px;font-weight:800}
.bar{height:11px;background:#252d3d;border-radius:20px;overflow:hidden;margin:9px 0}
.fill{height:100%;background:#ef476f}.xp{background:#785ce8}
.feedback{padding:14px;border-radius:14px;margin-top:12px;line-height:1.5}
.good{background:#103c2d;border:1px solid #277b5c}.bad{background:#431d2b;border:1px solid #91374f}
.next{width:100%;margin-top:10px;background:#7058e8}.danger{background:#8e3049}
.item{background:#192234;border:1px solid #2d3a55;border-radius:13px;padding:13px;margin:8px 0}
.locked{opacity:.4}.hidden{display:none}
</style>
</head>

<body>
<div class="app">

<header>
<h1>⚔️ English Quest</h1>
<div class="muted">Maks • A2 Adventurer • <span id="rank">A2 Adventurer</span></div>
<div class="stats">
<div class="stat">LEVEL<b id="level">2</b></div>
<div class="stat">💰 GOLD<b id="gold">150</b></div>
<div class="stat">❤️ HP<b id="hp">100</b></div>
<div class="stat">🔥 COMBO<b id="combo">0</b></div>
</div>
</header>

<div class="tabs">
<button class="tab active" onclick="tab('battle',this)">⚔️ Battle</button>
<button class="tab" onclick="tab('map',this)">🗺️ Map</button>
<button class="tab" onclick="tab('shop',this)">🏪 Shop</button>
<button class="tab" onclick="tab('hero',this)">🧙 Hero</button>
</div>

<section id="battle">
<div class="card">
<div id="enemyEmoji" class="enemy">👺</div>
<div id="enemyName" class="enemyname"></div>
<div class="bar"><div id="enemyBar" class="fill"></div></div>
<div id="enemyHpText" class="muted" style="text-align:center"></div>
</div>

<div class="card">
<div class="muted" id="zone">🌲 GRAMMAR FOREST</div>
<div id="question" class="question"></div>
<div id="answers" class="answers"></div>
<div id="feedback"></div>
</div>

<div class="card">
<div class="muted">XP</div>
<div class="bar"><div id="xpBar" class="fill xp"></div></div>
<div id="xpText" class="muted"></div>
</div>
</section>

<section id="map" class="hidden">
<div class="card">
<h2>🗺️ Mapa świata</h2>
<div id="mapList"></div>
</div>
</section>

<section id="shop" class="hidden">
<div class="card">
<h2>🏪 Sklep</h2>
<div id="shopList"></div>
</div>
</section>

<section id="hero" class="hidden">
<div class="card">
<h2>🧙 Bohater</h2>
<div id="heroList"></div>
</div>
</section>

</div>

<script>

const Q=[

["She usually ___ football.",
["watch","watches","is watching","watching"],1,
"Usually oznacza rutynę, więc używamy Present Simple. Przy SHE dodajemy -s.",
"SHE + USUALLY → WATCHES","Grammar"],

["I ___ a wedding film right now.",
["edit","edits","am editing","editing"],2,
"Right now oznacza czynność dziejącą się teraz. Potrzebujemy am + ING.",
"RIGHT NOW → AM/IS/ARE + ING","Grammar"],

["We usually ___ on weekends.",
["work","works","are working","working"],0,
"Przy WE nie dodajemy końcówki -s.",
"WE → WORK","Grammar"],

["She ___ TV now.",
["watch","watches","is watching","watching"],2,
"Now wymaga Present Continuous: is + czasownik-ing.",
"SHE + NOW → IS WATCHING","Grammar"],

["My friend ___ English every day.",
["study","studies","is studying","studying"],1,
"Every day oznacza rutynę. Study przy he/she/it zmienia się w studies.",
"HE/SHE/IT → STUDIES","Grammar"],

["This week I ___ on three wedding videos.",
["work","works","am working","working"],2,
"This week opisuje sytuację tymczasową.",
"THIS WEEK → AM WORKING","Grammar"],

["Jak po angielsku jest „obiektyw”?",
["camera","lens","screen","tripod"],1,
"Lens oznacza obiektyw. Tripod oznacza statyw.",
"LENS = OBIEKTYW","Vocabulary"],

["Jak powiedzieć „montować film”?",
["make a camera","edit a film","watch a film","shoot a tripod"],1,
"Edit a film oznacza montować film.",
"EDIT = MONTAŻ","Videographer"],

["He ___ football every Saturday.",
["play","plays","is playing","playing"],1,
"Every Saturday oznacza rutynę. Przy HE dodajemy -s.",
"HE + EVERY → PLAYS","Grammar"],

["I ___ in S-Log today.",
["shoot","am shooting","shoots","shooting"],1,
"Opisujemy bieżącą sesję, więc używamy Present Continuous.",
"I AM SHOOTING = NAGRYWAM TERAZ","Videographer"],

["The camera ___ on the tripod.",
["is","are","am","be"],0,
"Camera jest liczbą pojedynczą, więc używamy IS.",
"CAMERA → IS","Videographer"],

["Please ___ the footage.",
["export","exports","exporting","is export"],0,
"Po please używamy podstawowej formy czasownika.",
"PLEASE → EXPORT","Videographer"],

["Yesterday I ___ a wedding.",
["film","films","filmed","am filming"],2,
"Yesterday wymaga Past Simple. Film → filmed.",
"YESTERDAY → PAST SIMPLE","Grammar"],

["We ___ the audio yesterday.",
["sync","synced","are syncing","syncing"],1,
"Yesterday wymaga Past Simple: synced.",
"YESTERDAY → SYNCED","Videographer"],

["I am ___ the color.",
["grade","graded","grading","grades"],2,
"Po am używamy formy z -ing.",
"AM → GRADING","Videographer"],

["The wedding ___ beautiful.",
["is","are","am","be"],0,
"Wedding jest liczbą pojedynczą, więc używamy is.",
"SINGULAR → IS","Grammar"],

["We ___ the camera yesterday.",
["check","checked","are checking","checking"],1,
"Yesterday = Past Simple.",
"YESTERDAY → CHECKED","Videographer"],

["She ___ editing now.",
["is","are","am","be"],0,
"She + now = Present Continuous: she is editing.",
"SHE → IS","Grammar"],

["I usually ___ my footage at night.",
["edit","edits","am editing","editing"],0,
"Usually opisuje rutynę.",
"I + USUALLY → EDIT","Videographer"],

["The lens is very ___.",
["sharp","sharply","sharpen","sharpness"],0,
"Po is potrzebujemy przymiotnika: sharp.",
"LENS IS SHARP","Vocabulary"]

];


const ENEMIES=[
["Grammar Goblin","👺",100],
["Tense Troll","👹",140],
["Vocabulary Vampire","🧛",130],
["Sentence Wolf","🐺",170]
];

const BOSSES=[
["Past Dragon","🐲",260],
["Tense Demon","😈",320],
["English Overlord","👑",400]
];


let S=JSON.parse(localStorage.getItem("EQ4")||"null")||{

level:2,
xp:10,
gold:150,
hp:100,
combo:0,
qi:0,
enemyIndex:0,
enemyHp:100,

mistakes:[],
inventory:[],

correct:0,
total:0,

skills:{
Grammar:0,
Vocabulary:0,
Videographer:0,
Listening:0,
Speaking:0
},

hardcore:false,
shield:0,

kills:0,
bossesDefeated:[],

dailyKills:0,
streak:1,
lastDate:new Date().toDateString(),

achievements:[]

};


const $=id=>document.getElementById(id);

function save(){
localStorage.setItem("EQ4",JSON.stringify(S));
}


function rank(){

if(S.level>=20)return "🐉 Dragon Master";
if(S.level>=15)return "👑 Perfect Knight";
if(S.level>=10)return "⚔️ Tense Champion";
if(S.level>=5)return "🛡️ English Warrior";

return "🗡️ A2 Adventurer";

}


function isBoss(){

return S.kills>0 &&
S.kills%5===0 &&
!S.bossesDefeated.includes(S.kills);

}


function getEnemy(){

if(isBoss()){

return BOSSES[
Math.min(
Math.floor(S.level/7),
BOSSES.length-1
)
];

}

return ENEMIES[
S.enemyIndex%ENEMIES.length
];

}


function newEnemy(){

const e=getEnemy();

S.enemyHp=e[2];

$("enemyEmoji").textContent=e[1];

$("enemyName").textContent=
isBoss()
?"👑 BOSS • "+e[0]
:e[0];

$("zone").textContent=
isBoss()
?"👑 BOSS ARENA"
:S.level>=3
?"🏰 WORD CASTLE"
:"🌲 GRAMMAR FOREST";

draw();

}


function draw(){

const e=getEnemy();

$("enemyBar").style.width=
Math.max(
0,
S.enemyHp/e[2]*100
)+"%";

$("enemyHpText").textContent=
S.enemyHp+" / "+e[2]+" HP";

$("level").textContent=S.level;

$("gold").textContent=S.gold;

$("hp").textContent=S.hp;

$("combo").textContent=S.combo;

$("rank").textContent=rank();

$("xpText").textContent=
S.xp+" / 100 XP";

$("xpBar").style.width=
S.xp+"%";

save();

}


function showQuestion(){

const q=Q[S.qi%Q.length];

$("question").textContent=q[0];

$("answers").innerHTML=
q[1].map((answer,i)=>
`<button
class="answer"
onclick="answer(${i})">
${answer}
</button>`
).join("");

$("feedback").innerHTML="";

draw();

}


function addXP(amount){

const multiplier=
S.hardcore?1.5:1;

S.xp+=Math.round(amount*multiplier);

while(S.xp>=100){

S.xp-=100;

S.level++;

S.gold+=50;

S.hp=Math.min(
100,
S.hp+20
);

alert(
"🎉 LEVEL UP!\n\n"+
"Jesteś teraz na poziomie "+
S.level+"!"
);

}

}


function answer(index){

document
.querySelectorAll(".answer")
.forEach(
button=>button.disabled=true
);

const q=Q[S.qi%Q.length];

S.total++;


if(index===q[2]){

S.correct++;

S.combo++;

S.skills[q[6]]++;

let damage=
20+
(S.combo>=5?15:0);

if(
S.inventory.includes("⚔️ Grammar Sword")
)
damage+=5;

if(isBoss())
damage=Math.max(
10,
damage-5
);

S.enemyHp-=damage;

const gold=
S.combo>=3?15:10;

S.gold+=gold;

addXP(10);


$("feedback").innerHTML=`

<div class="feedback good">

⚔️ <b>HIT!</b>

<br><br>

⚔️ Damage: ${damage}

<br>
⭐ XP: +${Math.round(10*(S.hardcore?1.5:1))}

<br>
💰 Gold: +${gold}

<br>
🔥 Combo: x${S.combo}

</div>

`;


if(S.enemyHp<=0){

defeatEnemy();

}else{

setTimeout(
nextQuestion,
700
);

}

}else{

wrongAnswer(index,q);

}

draw();

}


function wrongAnswer(index,q){

S.combo=0;

let damage=
S.hardcore?25:15;

if(S.shield){

S.shield=0;

damage=0;

}

S.hp-=damage;

S.mistakes.push({

question:q[0],

correct:q[1][q[2]],

user:q[1][index],

time:new Date().toISOString()

});


$("feedback").innerHTML=`

<div class="feedback bad">

❌ <b>WRONG ANSWER</b>

<br><br>

👺 Monster attack:

<br>
❤️ -${damage} HP

<br><br>

❌ <b>Twoja odpowiedź:</b>

<br>
${q[1][index]}

<br><br>

✅ <b>Poprawna odpowiedź:</b>

<br>
${q[1][q[2]]}

<br><br>

📖 <b>Dlaczego?</b>

<br>
${q[3]}

<br><br>

🧠 <b>Zapamiętaj:</b>

<br>
${q[4]}

<br><br>

👻 Błąd dodany do <b>Haunted Mistakes</b>.

</div>

<button
class="next"
onclick="nextQuestion()">

➡️ Następne pytanie

</button>

`;


if(S.hp<=0){

S.hp=0;

$("feedback").innerHTML+=`

<div class="feedback bad">

☠️ <b>YOU DIED</b>

<br><br>

Tracisz Gold i możesz wrócić do walki.

</div>

<button
class="next danger"
onclick="revive()">

❤️ REVIVE

</button>

`;

}

}


function defeatEnemy(){

const boss=isBoss();

S.kills++;

S.dailyKills++;

S.gold+=boss?150:40;

addXP(boss?50:20);

if(boss){

S.bossesDefeated.push(S.kills);

}

const loot=openChest();

$("feedback").innerHTML=`

<div class="feedback good">

🏆 <b>${boss?"BOSS DEFEATED!":"ENEMY DEFEATED!"}</b>

<br><br>

💰 +${boss?150:40} Gold

<br>

⭐ +${boss?50:20} XP

<br><br>

🎁 <b>CHEST LOOT</b>

<br>

${loot}

</div>

<button
class="next"
onclick="nextQuestion()">

⚔️ Następna walka

</button>

`;

draw();

}


function openChest(){

const r=Math.random();

let item;

if(r<.45)
item=["Common","🧪 XP Potion"];

else if(r<.72)
item=["Uncommon","⚔️ Training Blade"];

else if(r<.88)
item=["Rare","📖 Grammar Codex"];

else if(r<.96)
item=["Epic","💍 Combo Ring"];

else if(r<.995)
item=["Legendary","⚔️ English Excalibur"];

else
item=["Mythic","🐉 Dragon Tongue"];

S.inventory.push(item[1]);

return `
✨ Rarity: <b>${item[0]}</b>
<br>
🎒 Loot: <b>${item[1]}</b>
`;

}


function nextQuestion(){

S.qi++;

if(
S.qi%4===0 &&
!isBoss()
){

S.enemyIndex++;

}

newEnemy();

showQuestion();

}


function revive(){

S.hp=100;

S.gold=
Math.max(
0,
S.gold-
(S.hardcore?75:50)
);

S.combo=0;

nextQuestion();

}


function tab(id,button){

[
"battle",
"map",
"shop",
"hero"
].forEach(
x=>$(x).classList.add("hidden")
);

$(id).classList.remove("hidden");

document
.querySelectorAll(".tab")
.forEach(
x=>x.classList.remove("active")
);

button.classList.add("active");

render();

}


function render(){

const locations=[

["🌲","Grammar Forest",1],
["🏰","Word Castle",2],
["🏜️","Past Desert",3],
["🌋","Tense Volcano",5],
["✈️","Airport City",4],
["🎬","Film Studio",2],
["🏨","Hotel District",5],
["🍽️","Restaurant Street",6],
["🏝️","Perfect Island",8],
["🐉","Dragon Realm",20]

];


$("mapList").innerHTML=
locations.map(location=>

`<div class="item ${
S.level>=location[2]?"":"locked"
}">

${location[0]}

<b>${location[1]}</b>

<br>

<span class="muted">

${
S.level>=location[2]
?"✅ UNLOCKED"
:"🔒 Level "+location[2]
}

</span>

</div>`

).join("");


const shop=[

["⚔️ Grammar Sword",80,"+5 damage"],
["📖 Vocabulary Tome",100,"+10% XP"],
["🧪 XP Potion",120,"+25 XP"],
["🛡️ Shield",150,"Blocks next mistake"]

];


$("shopList").innerHTML=
shop.map(item=>

`<div class="item">

${item[0]}

<br>

<span class="muted">

${item[2]} • ${item[1]} Gold

</span>

<button
class="next"
onclick="buy('${item[0]}',${item[1]})">

KUP

</button>

</div>`

).join("");


const accuracy=
S.total
?Math.round(
S.correct/S.total*100
)
:0;


$("heroList").innerHTML=`

<div class="item">

🎖️ <b>${rank()}</b>

<br>

Level ${S.level}

</div>


<div class="item">

🎯 <b>Accuracy:</b>

${accuracy}%

<br>

${S.correct}/${S.total} poprawnych

</div>


<div class="item">

📚 Grammar:

${S.skills.Grammar}

<br>

📖 Vocabulary:

${S.skills.Vocabulary}

<br>

🎬 Videographer:

${S.skills.Videographer}

</div>


<div class="item">

🎧 Listening:

${S.skills.Listening}

<br>

🗣️ Speaking:

${S.skills.Speaking}

</div>


<div class="item">

👻 <b>Haunted Mistakes:</b>

${S.mistakes.length}

</div>


<div class="item">

🎒 <b>Inventory</b>

<br>

${
S.inventory.length
?S.inventory.join(", ")
:"Empty"
}

</div>


<div class="item">

📅 Daily Quest:

${Math.min(S.dailyKills,5)}/5

<br>

🔥 Streak:

${S.streak} days

</div>


<div class="item">

🔥 Hardcore:

${S.hardcore?"ON":"OFF"}

<br>

${
S.level<5
?"🔒 Unlock at Level 5"
:"+50% XP / większe kary"
}

</div>


<button
class="next"
onclick="toggleHardcore()">

🔥 Hardcore

</button>


<button
class="next"
onclick="listeningQuest()">

🎧 Listening Quest

</button>


<button
class="next"
onclick="speakingQuest()">

🗣️ Speaking Quest

</button>


<button
class="next"
onclick="miniGame()">

🎮 Mini Game

</button>


<button
class="next danger"
onclick="resetGame()">

♻️ Reset Progress

</button>

`;

}


function buy(item,cost){

if(S.gold<cost){

alert(
"💰 Nie masz wystarczająco Gold."
);

return;

}

S.gold-=cost;


if(item.includes("Sword"))
S.inventory.push("⚔️ Grammar Sword");


if(item.includes("Tome"))
S.inventory.push("📖 Vocabulary Tome");


if(item.includes("Potion")){

addXP(25);

}


if(item.includes("Shield")){

S.shield=1;

S.inventory.push("🛡️ Shield");

}


render();

draw();

}


function toggleHardcore(){

if(S.level<5){

alert(
"🔒 Hardcore odblokuje się na poziomie 5."
);

return;

}

S.hardcore=!S.hardcore;

alert(
S.hardcore
?"🔥 HARDCORE ACTIVATED!\n+50% XP\nWiększe kary."
:"Hardcore wyłączony."
);

render();

draw();

}


function listeningQuest(){

const q=
Q[
Math.floor(
Math.random()*Q.length
)
];

if("speechSynthesis" in window){

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(
q[1][q[2]]
)
);

}

S.skills.Listening++;

save();

alert(
"🎧 Posłuchaj wymowy.\n\n"+
"Potem spróbuj powiedzieć słowo na głos."
);

render();

}


function speakingQuest(){

if(
!(
"SpeechRecognition" in window
)&&
!(
"webkitSpeechRecognition" in window
)
){

alert(
"🎙️ Ta przeglądarka nie obsługuje rozpoznawania mowy."
);

return;

}

const Recognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

const recognition=
new Recognition();

recognition.lang="en-US";

recognition.onresult=e=>{

const text=
e.results[0][0].transcript;

S.skills.Speaking++;

save();

alert(
"🎙️ Usłyszałem:\n\n"+
text+
"\n\n+1 Speaking XP"
);

render();

};

recognition.start();

}


function miniGame(){

const q=
Q[
Math.floor(
Math.random()*Q.length
)
];

const answer=
q[1][q[2]];

const scrambled=
answer
.split("")
.sort(
()=>Math.random()-.5
)
.join("");

alert(

"🎮 WORD SCRAMBLE\n\n"+
"Ułóż słowo/zwrot:\n\n"+
scrambled+
"\n\n"+
"Poprawna odpowiedź:\n"+
answer

);

}


function resetGame(){

if(
confirm(
"⚠️ Na pewno usunąć cały postęp?"
)
){

localStorage.removeItem("EQ4");

location.reload();

}

}


function checkDaily(){

const today=
new Date().toDateString();

if(S.lastDate!==today){

const yesterday=
new Date(
Date.now()-86400000
).toDateString();

if(S.lastDate===yesterday)
S.streak++;
else
S.streak=1;

S.dailyKills=0;

S.lastDate=today;

save();

}

}


checkDaily();

newEnemy();

showQuestion();

render();

draw();

</script>/* 
</body>
</html>
